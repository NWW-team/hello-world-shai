<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World — Vibecoden</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 0 0 24px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    button {
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
    }

    #output {
      margin-top: 20px;
      min-height: 24px;
      font-size: 0.95rem;
      color: var(--accent);
    }

    footer {
      margin-top: 32px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Vibecoden</span>
    <h1>Hello, World!</h1>
    <p>Dit is een kleine, met AI gebouwde "Hello World"-app. Klik op de knop en kijk wat er gebeurt.</p>
    <button id="greetButton">Zeg hallo</button>
    <div id="output"></div>
    <footer>Gebouwd met HTML, CSS &amp; JavaScript — geen server nodig.</footer>
  </div>

  <script>
    const button = document.getElementById('greetButton');
    const output = document.getElementById('output');
    const messages = [
      'Hallo daar! 👋',
      'Vibecoden werkt! ✨',
      'Deze app draait volledig in je browser.',
      'Nog een keer klikken? 😄'
    ];
    let index = 0;

    button.addEventListener('click', () => {
      output.textContent = messages[index % messages.length];
      index++;
    });
  </script>
</body>
</html>
